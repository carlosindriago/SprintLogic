name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  commit-lint:
    name: Validate PR Commits
    runs-on: ubuntu-latest
    # Only run on pull requests, not pushes to main
    if: github.event_name == 'pull_request'
    steps:
      - uses: amannn/action-semantic-pull-request@v5.5.3
        with:
          types: |
            fix
            feat
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            sec
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pr-size-check:
    name: Check PR Size Budget
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate PR Size (Max 400 lines unless size:exception)
        run: |
          ADDITIONS=${{ github.event.pull_request.additions }}
          DELETIONS=${{ github.event.pull_request.deletions }}
          TOTAL=$((ADDITIONS + DELETIONS))
          
          # Check for size:exception label
          LABELS="${{ join(github.event.pull_request.labels.*.name, ' ') }}"
          
          if [[ "$LABELS" == *"size:exception"* ]]; then
            echo "✅ PR has size:exception label. Skipping size check. ($TOTAL lines)"
            exit 0
          fi
          
          if [ "$TOTAL" -gt 400 ]; then
            echo "❌ PR exceeds 400 changed lines budget ($TOTAL lines)."
            echo "Please split this PR into smaller chunks or add the 'size:exception' label if approved by a maintainer."
            exit 1
          fi
          
          echo "✅ PR size is within budget ($TOTAL lines)."

  lint-and-test-api:
    name: Lint & Test Python (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/api
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "apps/api/pyproject.toml"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -e ".[dev]"
      - name: Lint with Ruff
        run: ruff check .
      - name: Typecheck with Mypy
        run: mypy .
      - name: Run Pytest
        run: pytest tests/

  lint-typecheck-web:
    name: Lint & Typecheck Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/web
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck with tsc
        run: npx tsc --noEmit
      - name: Run Linter
        run: npm run lint
